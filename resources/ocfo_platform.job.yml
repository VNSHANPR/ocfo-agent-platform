resources:
  jobs:
    ocfo_agent_platform_deploy:
      name: "[${bundle.target}] oCFO Agent Platform — deploy data, genie & supervisor"
      description: "End-to-end: build the data layer (tools + metric views), deploy the Genie spaces, then create/update the Multi-Agent Supervisor. Promotes the whole stack per environment."
      tasks:
        - task_key: deploy_data_layer
          notebook_task:
            notebook_path: ../src/deploy_data_layer.py
            base_parameters:
              catalog: ${var.catalog}
          environment_key: default

        - task_key: deploy_genie_spaces
          depends_on:
            - task_key: deploy_data_layer
          notebook_task:
            notebook_path: ../src/deploy_genie_spaces.py
            base_parameters:
              catalog: ${var.catalog}
              source_catalog: ${var.source_catalog}
              warehouse_id: ${var.warehouse_id}
              genie_parent_path: ${var.genie_parent_path}
          environment_key: default

        - task_key: deploy_supervisor
          depends_on:
            - task_key: deploy_genie_spaces
          notebook_task:
            notebook_path: ../src/create_supervisor.py
            base_parameters:
              catalog: ${var.catalog}
              supervisor_name: ${var.supervisor_name}
              ka_tile_id: ${var.ka_tile_id}
          environment_key: default

      environments:
        - environment_key: default
          spec:
            client: "3"
            dependencies:
              - databricks-sdk>=0.85.0
              - pyyaml
