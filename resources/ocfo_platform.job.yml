resources:
  jobs:
    ocfo_agent_platform_deploy:
      name: "[${bundle.target}] oCFO Agent Platform — deploy data & supervisor"
      description: "Builds the data layer (tools + metric views) then creates/updates the Multi-Agent Supervisor over the bundle's Genie spaces. Genie spaces themselves are native `genie_spaces` resources deployed by `bundle deploy`."
      tasks:
        - task_key: deploy_data_layer
          notebook_task:
            notebook_path: ../src/deploy_data_layer.py
            base_parameters:
              catalog: ${var.catalog}
          environment_key: default

        - task_key: deploy_supervisor
          depends_on:
            - task_key: deploy_data_layer
          notebook_task:
            notebook_path: ../src/create_supervisor.py
            base_parameters:
              catalog: ${var.catalog}
              supervisor_name: ${var.supervisor_name}
              ka_tile_id: ${var.ka_tile_id}
              # Genie space ids come straight from the native genie_spaces resources.
              genie_ocfo: ${resources.genie_spaces.ocfo.id}
              genie_hr: ${resources.genie_spaces.hr.id}
              genie_concur: ${resources.genie_spaces.travel_expense.id}
              genie_ariba: ${resources.genie_spaces.supplier.id}
          environment_key: default

      environments:
        - environment_key: default
          spec:
            client: "3"
            dependencies:
              - databricks-sdk>=0.85.0
              - pyyaml
